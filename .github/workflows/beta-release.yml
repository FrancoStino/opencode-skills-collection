name: Beta release

on:
  workflow_dispatch:
    inputs:
      prerelease:
        description: 'Prerelease identifier'
        required: false
        default: beta
  push:
    branches:
      - develop

permissions:
  contents: write
  packages: write

jobs:
  beta-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build package
        run: bun run build

      - name: Set beta version
        id: version
        env:
          PRERELEASE: ${{ inputs.prerelease || 'beta' }}
        run: |
          bun pm version prerelease --preid "$PRERELEASE" --no-git-tag-version
          echo "version=$(bun -e 'console.log((await Bun.file("package.json").json()).version)')" >> "$GITHUB_OUTPUT"

      - name: Publish beta package
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: bun publish --tag beta

      - name: Create beta tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json bun.lock
          git commit -m "chore: release v${{ steps.version.outputs.version }}" || true
          git tag "v${{ steps.version.outputs.version }}"
          git push origin HEAD:develop --follow-tags
