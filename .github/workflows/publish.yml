name: Publish to npm

on:
  workflow_run:
    workflows: [ "Create Release", "Auto-Sync Skills" ]
    types: [ completed ]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    # Skip if triggered by workflow_run that did not succeed
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Validate source branch
        if: github.event_name == 'workflow_run'
        run: |
          if [ "${{ github.event.workflow_run.head_branch }}" != "main" ]; then
            echo "::error::Refusing to publish from non-main branch: ${{ github.event.workflow_run.head_branch }}"
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: main
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build TypeScript
        run: npm run build

      - name: Check if version already published
        id: version_check
        run: |
          PACKAGE_NAME=$(node -p "require('./package.json').name")
          LOCAL_VERSION=$(node -p "require('./package.json').version")
          REMOTE_VERSION=$(npm view "$PACKAGE_NAME" version 2>/dev/null || echo "0.0.0")
          if [ "$LOCAL_VERSION" = "$REMOTE_VERSION" ]; then
            echo "Version $LOCAL_VERSION already published. Skipping."
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "New version $LOCAL_VERSION detected (remote: $REMOTE_VERSION). Publishing."
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      # setup-node@v6 (v6.4.0) still exports a dummy NODE_AUTH_TOKEN that
      # overrides OIDC. Strip the _authToken from .npmrc so npm falls through
      # to OIDC trusted publisher auth. Remove this step once setup-node v6.5+
      # ships the fix (PR #1558).
      - name: Strip dummy auth token for OIDC
        if: steps.version_check.outputs.skip != 'true'
        run: |
          NPMRC="${NPM_CONFIG_USERCONFIG:-$HOME/.npmrc}"
          if [ -f "$NPMRC" ]; then
            sed -i '/_authToken/d' "$NPMRC"
            echo "Stripped _authToken from $NPMRC"
          fi

      - name: Publish to npm
        if: steps.version_check.outputs.skip != 'true'
        run: npm publish --provenance --access public
