name: Sync skills

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *'

permissions:
  contents: write

jobs:
  sync-skills:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.WORKFLOW_TOKEN }}
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Sync bundled skills
        run: |
          rm -rf bundled-skills
          bunx --yes agentic-awesome-skills --path "$GITHUB_WORKSPACE/bundled-skills"

      - name: Download and validate skills index
        run: |
          curl -fsSL https://raw.githubusercontent.com/sickn33/agentic-awesome-skills/main/skillsindex.json -o skills_index.json
          bun -e 'JSON.parse(await Bun.file("skills_index.json").text()); console.log(`✅ skills_index.json valid (${(await Bun.file("skills_index.json").size} bytes)`)'

      - name: Install dependencies and build
        run: |
          bun install --frozen-lockfile
          bun run build

      - name: Scan and remove dangerous skills
        run: bun scripts/ci-scan-skills.mjs

      - name: Commit generated changes
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: 'chore: sync bundled skills'
          file_pattern: 'bundled-skills skills_index.json'
