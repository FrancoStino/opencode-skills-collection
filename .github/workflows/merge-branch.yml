name: Sync multiple branches

on:
  workflow_run:
    workflows: [ "Publish to npm" ]
    types:
      - completed

permissions:
  contents: write

jobs:
  merge-main-to-develop:
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion == 'success'
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Merge main to develop
        run: |
          git checkout develop
          git merge origin/main --no-edit || {
            echo "⚠️ Merge conflict detected, resolving..."
          
            # Check if bun.lock has conflicts
            if git diff --name-only --diff-filter=U | grep -q "bun.lock"; then
              echo "📦 Resolving bun.lock conflicts with bun..."
              rm bun.lock
              bun install
              git add bun.lock
            fi

            # Fail loudly if any conflicts remain unresolved
            REMAINING=$(git diff --name-only --diff-filter=U)
            if [ -n "$REMAINING" ]; then
              echo "::error::Unresolved merge conflicts in: $REMAINING"
              exit 1
            fi
          
            git commit --no-edit
          }

      - name: Auto-version beta after merge
        id: auto_version
        run: |
          MERGED_VERSION=$(git show origin/main:package.json | node -p "JSON.parse(require('fs').readFileSync('/dev/stdin','utf8')).version")
          echo "Merged version from main: $MERGED_VERSION"

          CURRENT_VERSION=$(node -p "require('./package.json').version")
          echo "Current develop version: $CURRENT_VERSION"

          CURRENT_BASE=$(echo "$CURRENT_VERSION" | sed 's/-beta\.[0-9]*$//')

          IS_NEWER=$(MERGED="$MERGED_VERSION" CURRENT="$CURRENT_BASE" node -e "
            const merged = process.env.MERGED.split('.').map(Number);
            const current = process.env.CURRENT.split('.').map(Number);
            const newer = merged[0] > current[0]
              || (merged[0] === current[0] && merged[1] > current[1])
              || (merged[0] === current[0] && merged[1] === current[1] && merged[2] > current[2]);
            console.log(newer ? 'true' : 'false');
          ")

          if [[ "$IS_NEWER" == "true" && ! "$MERGED_VERSION" == *"-beta"* ]]; then
            echo "📦 New stable version detected, creating beta..."

            bun pm version "$MERGED_VERSION" --no-git-tag-version
            bun pm version prerelease --preid=beta --no-git-tag-version

            NEW_VERSION=$(node -p "require('./package.json').version")
            echo "new_version=$NEW_VERSION" >> $GITHUB_OUTPUT
            echo "✅ Created new beta version: $NEW_VERSION"

            git add package.json
            git commit -m "chore: auto-version to $NEW_VERSION after merge"
            git tag "$NEW_VERSION"
          else
            echo "No version bump needed"
            echo "new_version=$CURRENT_VERSION" >> $GITHUB_OUTPUT
          fi

      - name: Push changes
        run: git push origin develop --tags
